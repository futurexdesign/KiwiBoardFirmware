; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Use the earlephilhower core rather than mbed.
; Hardware is bifurcated by MCU: RP2040 (Pico) = TMC5160 SPI, RP2350 = TMC2209 UART.

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
board_build.core = earlephilhower
framework = arduino
lib_deps =
	tcmenu/tcMenu@4.0.0
	tcmenu/IoAbstraction@^4.0.0
	tcmenu/tcUnicodeHelper@^1.0.0
	tommag/TMC5160@^1.1.0
	bodmer/TFT_eSPI@^2.5.23
	bitbank2/PNGdec@^1.0.1
	hideakitai/DebugLog@^0.8.3
monitor_speed = 115200
build_flags =
	-Os
	-DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
	-DUSER_SETUP_LOADED=1
	-DILI9341_DRIVER=1
	-DTFT_MISO=16
	-DTFT_MOSI=19
	-DTFT_SCLK=18
	-DTFT_CS=20
	-DTFT_DC=21
	-DTFT_RST=22
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_FONT6=1
	-DLOAD_FONT7=1
	-DLOAD_FONT8=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=70000000
	-DSPI_READ_FREQUENCY=20000000
	-DMINIMUM_CURSOR_SIZE=20
build_src_filter =
	+<*>
	-<tmc2209Driver.cpp>

; RP2350B (generic_rp2350) board revision — QFN-80, GPIO0-47.
; LCD SPI pins and encoder/button remaps are in src/picoPlatform.h (ARDUINO_GENERIC_RP2350).
[env:rp2350]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = generic_rp2350
board_build.core = earlephilhower
; Our build in RP2354 has 2MB of flash available
board_build.flash_size = 2MB
board_upload.maximum_size = 2097152
framework = arduino
lib_deps =
	tcmenu/tcMenu@4.0.0
	tcmenu/IoAbstraction@^4.0.0
	tcmenu/tcUnicodeHelper@^1.0.0
	teemuatlut/TMCStepper@^0.7.3
	git@github.com:futurexdesign/TFT_eSPI.git
	bitbank2/PNGdec@^1.0.1
	hideakitai/DebugLog@^0.8.3
monitor_speed = 115200
upload_protocol = picoprobe
debug_tool = picoprobe
build_flags =
	-Os
	-DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
	-D__PICO_RP2350A=0
	-DUSER_SETUP_LOADED=1
	-DILI9341_DRIVER=1
	-DTFT_MISO=36
	-DTFT_MOSI=39
	-DTFT_SCLK=34
	-DTFT_CS=30
	-DTFT_DC=32
	-DTFT_RST=31
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_FONT6=1
	-DLOAD_FONT7=1
	-DLOAD_FONT8=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=70000000
	-DSPI_READ_FREQUENCY=20000000
	-DMINIMUM_CURSOR_SIZE=20
build_src_filter =
	+<*>
	-<tmc5160Driver.cpp>
