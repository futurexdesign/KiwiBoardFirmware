; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Use the earlephilhower core rather than mbed
; Default: boot-time autodetection (TMC2209 half-duplex on TMC_SS, else TMC5160 SPI)
[env:pico]
extends = env:pico-autodetect

[env:pico-autodetect]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
lib_deps =
	tcmenu/tcMenu@4.0.0
	tcmenu/IoAbstraction@^4.0.0
	tcmenu/tcUnicodeHelper@^1.0.0
	tommag/TMC5160@^1.1.0
	teemuatlut/TMCStepper@^0.7.3
	bodmer/TFT_eSPI@^2.5.23
	bitbank2/PNGdec@^1.0.1
	hideakitai/DebugLog@^0.8.3
monitor_speed = 115200
; upload_protocol = cmsis-dap
; debug_tool = cmsis-dap
build_flags =
	-Os
	-DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
	-DUSER_SETUP_LOADED=1
	-DILI9341_DRIVER=1
	-DTFT_MISO=16
	-DTFT_MOSI=19
	-DTFT_SCLK=18
	-DTFT_CS=20
	-DTFT_DC=21
	-DTFT_RST=22
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_FONT6=1
	-DLOAD_FONT7=1
	-DLOAD_FONT8=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=70000000
	-DSPI_READ_FREQUENCY=20000000
	-DMINIMUM_CURSOR_SIZE=20
	-DMOTOR_DRIVER_AUTODETECT=1
	-DTMC2209_UART_HALFDUPLEX=1
build_src_filter =
	+<*>

[env:pico-tmc5160]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
lib_deps =
	tcmenu/tcMenu@4.0.0
	tcmenu/IoAbstraction@^4.0.0
	tcmenu/tcUnicodeHelper@^1.0.0
	tommag/TMC5160@^1.1.0
	bodmer/TFT_eSPI@^2.5.23
	bitbank2/PNGdec@^1.0.1
	hideakitai/DebugLog@^0.8.3
monitor_speed = 115200
build_flags =
	-Os
	-DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
	-DUSER_SETUP_LOADED=1
	-DILI9341_DRIVER=1
	-DTFT_MISO=16
	-DTFT_MOSI=19
	-DTFT_SCLK=18
	-DTFT_CS=20
	-DTFT_DC=21
	-DTFT_RST=22
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_FONT6=1
	-DLOAD_FONT7=1
	-DLOAD_FONT8=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=70000000
	-DSPI_READ_FREQUENCY=20000000
	-DMINIMUM_CURSOR_SIZE=20
build_src_filter =
	+<*>
	-<tmc2209Driver.cpp>
	-<tmcHalfDuplexUart.cpp>

[env:pico-tmc2209]
extends = env:pico-tmc5160
build_flags =
	${env:pico-tmc5160.build_flags}
	-DMOTOR_DRIVER_TMC2209=1
lib_deps =
	tcmenu/tcMenu@4.0.0
	tcmenu/IoAbstraction@^4.0.0
	tcmenu/tcUnicodeHelper@^1.0.0
	teemuatlut/TMCStepper@^0.7.3
	bodmer/TFT_eSPI@^2.5.23
	bitbank2/PNGdec@^1.0.1
	hideakitai/DebugLog@^0.8.3
build_src_filter =
	+<*>
	-<tmc5160Driver.cpp>
	-<tmcHalfDuplexUart.cpp>

; Forced TMC2209 with half-duplex UART on TMC_SS (GPIO13)
[env:pico-tmc2209-halfduplex]
extends = env:pico-tmc2209
build_flags =
	${env:pico-tmc2209.build_flags}
	-DTMC2209_UART_HALFDUPLEX=1
build_src_filter =
	+<*>
	-<tmc5160Driver.cpp>

; ============================================================================
; RP2350 (generic_rp2350) board revision.
; Same firmware/build matrix as the RP2040 (Pico) targets above, but for a
; board with the LCD SPI bus and encoder/button pins remapped (see
; src/picoPlatform.h, guarded by ARDUINO_GENERIC_RP2350).
; ============================================================================

; Default: boot-time autodetection (TMC2209 half-duplex on TMC_SS, else TMC5160 SPI)
[env:rp2350]
